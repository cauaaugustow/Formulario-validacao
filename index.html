<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação de formulario</title>
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

    <div class="container">
        <div class="card">

            <div class="header">
                <h1>Criar Conta</h1>
                <p>Preencha os dados abaixo para realizar seu cadastro.</p>
            </div>

            <form>

                <div class="input-group">
                    <div class="input-box">
                        <label for="nome">Nome</label>
                        <input
                            type="text"
                            id="nome"
                            placeholder="Digite seu nome"
                            required
                        >
                    </div>

                    <div class="input-box">
                        <label for="sobrenome">Sobrenome</label>
                        <input
                            type="text"
                            id="sobrenome"
                            placeholder="Digite seu sobrenome"
                            required
                        >
                    </div>
                </div>

                <div class="input-box">
                    <label for="cpf">CPF</label>
                    <input
                        type="text"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                    >
                </div>

                <div class="input-box">
                    <label for="usuario">Usuário</label>
                    <input
                        type="text"
                        id="usuario"
                        placeholder="Escolha um usuário"
                        required
                    >
                </div>

                <div class="input-box">
                    <label for="senha">Senha</label>
                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit">
                    Cadastrar
                </button>

            </form>

        </div>
    </div>

</body>
</html>
